# Configuration de la base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:healthSOD}${DB_SSL:}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuration du serveur
server.port=${PORT:8080}

# Configuration JWT
jwt.secret=${JWT_SECRET:Qw8zVn2pLk6sTg4yXc1eRb7uJm5oHq9wZt3vYf0aSd8lGh2jKr6bWn4xPq7cUi1MQAZwsx2Vn5pLk8sTg7yXc4eRb9uJm6oHq0wZt5vYf3aSd1lGh8jKr2bWn7xPq4cUi9M}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS - origines autorisées (séparées par virgule)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# Logging
logging.level.com.example.backend=INFO
logging.level.org.springframework.security=WARN
